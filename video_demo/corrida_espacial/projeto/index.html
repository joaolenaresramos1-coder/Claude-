<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0e2020}
.abs{position:absolute;left:0;top:0}
#bg{width:2300px;height:1400px;background:url(assets/bg_teal.jpg);}
#vig{width:1920px;height:1080px;background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.92) 100%);pointer-events:none;z-index:50}
.grain{width:1920px;height:1080px;mix-blend-mode:overlay;opacity:.16;z-index:51}
#flick{width:1920px;height:1080px;background:#000;z-index:52}
#fade{width:1920px;height:1080px;background:#000;z-index:60}
#layer{width:1920px;height:1080px}
.card{position:absolute;left:0;top:0;padding:16px 16px 18px;background:url(assets/paper.jpg) #ece6d6;background-size:cover;box-sizing:border-box;
  box-shadow:0 28px 55px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35);transform-origin:50% 50%}
.card .ph{overflow:hidden;position:relative;background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.28) saturate(.72) contrast(1.08) brightness(.96);transform-origin:50% 50%}
.card .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(40,25,5,.45)}
.lbls{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.lbl{position:absolute;white-space:pre;background:#0d0d0d;color:#f1f1f1;font:700 22px/1 'Courier Prime',monospace;letter-spacing:2.5px;padding:7px 12px 6px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.note{position:absolute;left:0;top:0;background:url(assets/paper.jpg);background-size:cover;box-shadow:0 26px 50px rgba(0,0,0,.55);
  font:700 44px/1.5 'Courier Prime',monospace;color:#2a2620;padding:58px 70px;white-space:pre;box-sizing:border-box}
.stamp{position:absolute;left:0;top:0;color:#b8241c;border:7px solid #b8241c;font:700 70px/1 'Courier Prime',monospace;letter-spacing:6px;padding:14px 26px 10px;
  -webkit-mask-image:url(assets/stamp_mask.png);-webkit-mask-size:100% 100%;mix-blend-mode:multiply;transform-origin:50% 50%;white-space:nowrap;z-index:5}
.ttl{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ttl .l1{font:700 42px/1.2 'Courier Prime',monospace;color:#e4ecea;letter-spacing:4px;position:relative;white-space:pre}
.ttl .l1 i{position:absolute;left:-6px;top:50%;height:4px;background:#c0302a;border-radius:2px}
.ttl .l2{font:700 120px/1.1 'Libre Baskerville',serif;color:#f6f3ee;margin-top:30px;letter-spacing:2px;max-width:1700px;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.ttl .l2 b{color:#c0302a}
.ttl .ch{font:700 30px/1 'Courier Prime',monospace;color:#d6e2df;letter-spacing:10px;margin-bottom:26px}
.ttl .rule{width:0;height:3px;background:#c0302a;margin-top:30px}
.anim{position:absolute;left:0;top:0;width:1920px;height:1080px;background:url(assets/sepia.jpg);overflow:hidden}
.hud{position:absolute;white-space:pre;background:#2b2116;color:#efe4cc;font:700 25px/1 'Courier Prime',monospace;letter-spacing:3px;padding:8px 14px 7px}
.hud.red{background:#a3221a;color:#fff}
svg{overflow:visible}
</style></head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div id="layer" class="abs"></div>
  <div id="vig" class="abs"></div>
  <div id="grains"></div>
  <div id="flick" class="abs"></div>
  <div id="fade" class="abs"></div>
</div>
<script src="engine.js"></script>
<script src="cenas.js"></script>
</body></html>
